app = "cyou-cliproxyapi"
primary_region = "iad"
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  CLIPROXY_LATENCY_DIAGNOSTIC_DIR = "/data/latency-diagnostics"
  TZ = "America/New_York"

[processes]
  # wireproxy serves socks5h://127.0.0.1:1080 over the home WireGuard tunnel in /data/wireproxy.conf; fly-wireproxy.sh keeps it running.
  app = "sh -c 'sh /CLIProxyAPI/fly-wireproxy.sh & exec /CLIProxyAPI/CLIProxyAPI --config /data/config.yaml'"

[http_service]
  internal_port = 8317
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  processes = ["app"]

  [http_service.http_options]
    idle_timeout = 600

[[mounts]]
  source = "proxy_data"
  destination = "/data"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "1024mb"
