app = "cyou-cliproxyapi"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[processes]
  app = "/CLIProxyAPI/CLIProxyAPI --config /data/config.yaml"

[http_service]
  internal_port = 8317
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  processes = ["app"]

  [http_service.http_options]
    idle_timeout = 600

[[mounts]]
  source = "proxy_data"
  destination = "/data"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
